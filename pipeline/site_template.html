<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติวนักวิชาการคอม กรมที่ดิน</title>
<meta name="description" content="คลังข้อสอบและสรุปเนื้อหาจากเล่มน้ำตาล 1–2 แบ่งตามบทและระดับความยาก พร้อมจำลองสอบกรมที่ดิน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea;--card:#ffffff;--ink:#241d16;--muted:#6f655a;--line:#e3dbcd;--soft:#efe8dc;
  --accent:#8b5a2b;--accent-ink:#ffffff;--accent-soft:#f4e7d7;--accent-strong:#6e4420;
  --ok:#1d7f46;--okbg:#e1f3e7;--no:#b8352a;--nobg:#fbe5e1;--star:#c98a0b;--warnbg:#fff4d6;
  --l1:#3f8a57;--l2:#c08423;--l3:#b5483b;
  --hero1:#734420;--hero2:#a8692f;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.07);
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New","Noto Sans Thai",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15120e;--card:#211c16;--ink:#efe7db;--muted:#a99d8e;--line:#3a3229;--soft:#2c261f;
    --accent:#d9a066;--accent-ink:#1d140b;--accent-soft:#3a2b1c;--accent-strong:#f0c08e;
    --ok:#4cc27f;--okbg:#16301f;--no:#ff7d6c;--nobg:#3b1c18;--star:#f2b632;--warnbg:#3a3015;
    --l1:#5bbd7a;--l2:#e2a540;--l3:#ec7262;--hero1:#4d2e15;--hero2:#7a4b22;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120e;--card:#211c16;--ink:#efe7db;--muted:#a99d8e;--line:#3a3229;--soft:#2c261f;
  --accent:#d9a066;--accent-ink:#1d140b;--accent-soft:#3a2b1c;--accent-strong:#f0c08e;
  --ok:#4cc27f;--okbg:#16301f;--no:#ff7d6c;--nobg:#3b1c18;--star:#f2b632;--warnbg:#3a3015;
  --l1:#5bbd7a;--l2:#e2a540;--l3:#ec7262;--hero1:#4d2e15;--hero2:#7a4b22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:var(--fs,16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun","Leelawadee UI","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
.muted{color:var(--muted)}
small{font-size:.82rem}
h1,h2,h3{line-height:1.35}

/* top bars */
.top,.qbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .back,.qbar .x{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);font-size:1.3rem;line-height:1}
.top .tt,.qbar .qt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .qc{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.timer.warn{background:var(--nobg);color:var(--no)}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* hero/home */
.hero{margin:16px 0 14px;padding:20px 18px 18px;border-radius:20px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;box-shadow:var(--shadow)}
.hero .hk{font-size:.85rem;opacity:.85}
.hero h1{margin:2px 0 14px;font-size:1.55rem}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hstats b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.hstats span{font-size:.75rem;opacity:.9;line-height:1.3;display:block}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qa{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:100px}
.qa .qi{font-size:1.35rem}
.qa b{font-size:.98rem;line-height:1.3}
.qa small{color:var(--muted);line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin:12px 0}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::after{content:"＋";color:var(--muted)}
details.card[open]>summary::after{content:"－"}
details.card>summary::-webkit-details-marker{display:none}
.guide ol{padding-left:1.3em;margin:10px 0}
.warnbox{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 2px 6px}
.sec h2{margin:0;font-size:1.2rem}
.sec small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.chap{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.chap .cnum{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.chap .cbody{flex:1;min-width:0}
.chap .ctitle{font-weight:600;line-height:1.35}
.chap .cmeta{font-size:.8rem;color:var(--muted)}
.chap .chev{color:var(--muted);font-size:1.4rem}
.star{color:var(--star)}
.bars{display:flex;gap:4px;margin:6px 0 2px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:99px}
.bar.l1 i{background:var(--l1)}.bar.l2 i{background:var(--l2)}.bar.l3 i{background:var(--l3)}
.foot{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.foot .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--no);color:var(--no)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.full{width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.05rem}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row2>.btn{flex:1 1 160px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* chapter */
.ch1{font-size:1.4rem;margin:16px 0 6px}
.badge-star{display:inline-block;font-size:.85rem;font-weight:600;color:var(--star);background:var(--warnbg);padding:3px 10px;border-radius:99px;margin-bottom:6px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.93rem;margin:10px 0}
.read-btn{width:100%;margin:6px 0 4px;font-size:1.02rem}
.opts{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0}
.opt>span{width:78px;font-size:.88rem;color:var(--muted)}
.lvcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l1);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.lvcard.l2{border-left-color:var(--l2)}.lvcard.l3{border-left-color:var(--l3)}
.lvh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvh b{font-size:1.05rem}
.lvh span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.lvcard p{margin:4px 0 6px;font-size:.9rem;color:var(--muted)}
.lvcard .kinds{font-size:.8rem;color:var(--muted)}
.lvp{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.lvp small{white-space:nowrap;color:var(--muted)}
.lvcard .btn{width:100%}
.cnav{display:flex;gap:8px;margin-top:18px}
.cnav a{flex:1;font-size:.88rem}

/* summary reading */
.toc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.toc button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{font-size:.98rem}
.md h2{font-size:1.15rem;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent-soft);scroll-margin-top:70px}
.md h3{font-size:1.02rem;margin:18px 0 6px;color:var(--accent-strong)}
.md ul,.md ol{padding-left:1.25em;margin:6px 0}
.md li{margin:5px 0}
.md li>ul,.md li>ol{margin:3px 0}
.md p{margin:8px 0}
.md b{color:var(--accent-strong)}
code{font-family:var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.88em;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:4.5em}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-weight:600}

/* question */
.qwrap{padding-top:6px}
.card.q{padding:16px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:600}
.tag.lv1{background:color-mix(in srgb,var(--l1) 18%,transparent);color:var(--l1)}
.tag.lv2{background:color-mix(in srgb,var(--l2) 20%,transparent);color:var(--l2)}
.tag.lv3{background:color-mix(in srgb,var(--l3) 18%,transparent);color:var(--l3)}
.stem{font-size:1.06rem;font-weight:600;white-space:pre-wrap}
.ctx{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem;overflow-x:auto}
.ctx.code{font-family:var(--mono);font-size:.85rem;white-space:pre;line-height:1.5}
.figs img{display:block;max-width:100%;height:auto;margin:10px auto;border-radius:10px;background:#fff;border:1px solid var(--line)}
.choices{margin-top:12px}
.ch{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:8px 0;cursor:pointer;line-height:1.5}
.ch .lt{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:.9rem}
.ch .ct{flex:1;min-width:0;white-space:pre-wrap;padding-top:1px}
.ch .ct i{color:var(--muted)}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch.sel .lt{background:var(--accent);color:var(--accent-ink)}
.ch.right{border-color:var(--ok);background:var(--okbg)}
.ch.right .lt{background:var(--ok);color:#fff}
.ch.wrong{border-color:var(--no);background:var(--nobg)}
.ch.wrong .lt{background:var(--no);color:#fff}
.ch.dim{opacity:.7}
.ch:disabled{cursor:default}
@media (hover:hover){.ch:not(:disabled):hover{border-color:var(--accent)}}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);border-left:4px solid var(--muted)}
.exp.ok{border-left-color:var(--ok)}.exp.no{border-left-color:var(--no)}
.exp .eh{font-weight:700;margin-bottom:4px}
.exp.ok .eh{color:var(--ok)}.exp.no .eh{color:var(--no)}
.exp .et{white-space:pre-wrap}
.exp .src{margin-top:8px;font-size:.8rem;color:var(--muted)}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0;font-weight:600}
.score{color:var(--muted);font-size:.9rem}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center}
.actbar>*{flex:1;max-width:364px}
.actbar .hint{text-align:center;color:var(--muted);padding:10px 0;max-width:728px}
.mhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:6px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.grid button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.grid button.f{box-shadow:inset 0 0 0 2px var(--star)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* results */
.res{text-align:center;padding:22px 16px}
.res .big{font-size:3rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.res .big small{font-size:1.1rem;color:var(--muted);font-weight:600}
.res .msg{margin:6px 0 0;font-weight:600}
.pass{color:var(--ok)}.fail{color:var(--no)}
.gt td:last-child,.gt th:last-child{text-align:right;white-space:nowrap}
.gbar{height:6px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.item{margin:10px 0}
.item>summary{cursor:pointer;list-style:none;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;gap:8px;align-items:flex-start}
.item>summary::-webkit-details-marker{display:none}
.item[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.item>summary .num{flex:none;font-weight:700;color:var(--muted);min-width:2em}
.item>summary .mk{flex:none;font-weight:700}
.item>summary .mk.ok{color:var(--ok)}.item>summary .mk.no{color:var(--no)}
.item>summary .pv{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .card.q{margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top:0;box-shadow:none}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.setrow>div:first-child{flex:1;min-width:0}
.setrow b{display:block;line-height:1.35}
.setrow small{color:var(--muted)}
.setbtn{display:flex;gap:6px;flex:none}
.hist{font-size:.9rem}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sizes{display:grid;gap:10px;margin:12px 0}
.sizes .btn{justify-content:space-between;padding:14px 16px}
.sizes .btn small{font-weight:400;opacity:.85}
input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 4px}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media (min-width:640px){.hero h1{font-size:1.8rem}.quick{grid-template-columns:repeat(4,1fr)}}
@media (max-width:360px){.hstats b{font-size:1.1rem}.opt>span{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:16px">หน้านี้ต้องเปิด JavaScript (ถ้าเปิดผ่านแอปดูไฟล์ ให้เลือกเปิดด้วย Chrome หรือ Safari)</p></noscript>
<!--DATA-->
<script>
(function(){
'use strict';
var J=function(id){return JSON.parse(document.getElementById(id).textContent);};
var META=J('d-meta'), SUM=J('d-sum'), Q=J('d-q'), IMG=J('d-img');
var CH=META.chapters, CHK={}, STAR={}, GROUPS=META.groups, GOF={};
CH.forEach(function(c){CHK[c.k]=c;});
META.star.forEach(function(k){STAR[k]=1;});
GROUPS.forEach(function(g,i){g.chs.forEach(function(k){GOF[k]=i;});});
var LETTER=['ก','ข','ค','ง','จ','ฉ'];
var LVNAME={1:'ด่าน 1 · พื้นฐาน',2:'ด่าน 2 · ฝึกฝน',3:'ด่าน 3 · ของจริง'};
var LVSHORT={1:'ด่าน 1',2:'ด่าน 2',3:'ด่าน 3'};
var LVDESC={1:'ข้อสอบท้ายบทในเล่มน้ำตาล ใช้เช็กว่าอ่านแล้วจำได้',2:'ข้อสอบเพิ่มเติม ข้อสอบประจำเดือน และโจทย์ฝึกที่เรียบเรียงจากเนื้อหา',3:'ข้อสอบจริงหลายสนาม (สพฐ. กทม. อาชีวะ ท้องถิ่น) และข้อสอบโค้งสุดท้าย'};
var KINDNAME={book:'ท้ายบท',extra:'เพิ่มเติมในเล่ม',monthly:'ประจำเดือน',auth:'โจทย์ฝึก',real:'ข้อสอบจริง',final:'โค้งสุดท้าย'};
var BYID={}, BYCH={};
CH.forEach(function(c){BYCH[c.k]={1:[],2:[],3:[]};});
Q.forEach(function(q,i){q._i=i;q._k=q.b+'-'+q.c;BYID[q.id]=q;if(BYCH[q._k])BYCH[q._k][q.lv].push(q);});

/* ---------- storage ---------- */
var KEY='ltd-cs-quiz-v1';
var S={p:{},bm:{},hist:[],o:{n:20,ord:'rand',only:'all',fs:0,theme:'auto',font:1}};
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&typeof o==='object'){if(o.p)S.p=o.p;if(o.bm)S.bm=o.bm;if(o.hist)S.hist=o.hist;if(o.o)for(var k in o.o)S.o[k]=o.o[k];}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function record(q,c){var ok=c===q.a;var r=S.p[q.id]||[0,0,0];r[0]=ok?1:0;r[1]++;if(ok)r[2]++;S.p[q.id]=r;return ok;}
function isDone(q){return !!S.p[q.id];}
function isWrong(q){var r=S.p[q.id];return !!r&&r[0]===0;}
function stat(list){var d=0,ok=0;for(var i=0;i<list.length;i++){var r=S.p[list[i].id];if(r){d++;if(r[0])ok++;}}return {n:list.length,d:d,ok:ok};}
function pct(a,b){return b?Math.round(a/b*100):0;}
function chAll(k){var B=BYCH[k];return B[1].concat(B[2],B[3]);}

/* ---------- helpers ---------- */
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function go(h){if(location.hash===h)route();else location.hash=h;}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
function top(back,title,extra){return '<div class="top"><a class="back" href="'+back+'" aria-label="ย้อนกลับ">‹</a><div class="tt">'+esc(title)+'</div>'+(extra||'')+'</div>';}
function chapLabel(q){return 'เล่ม '+q.b+' บท '+q.c;}
function srcLabel(q){return q.src+(q.page?' · หน้า '+q.page:'');}
function fmt(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;var p=function(x){return (x<10?'0':'')+x;};return (h?h+':'+p(m):m)+':'+p(s);}
function bar(cls,f){return '<span class="bar '+cls+'"><i style="width:'+(f*100).toFixed(1)+'%"></i></span>';}
function kindsLine(list){var c={};list.forEach(function(q){c[q.kind]=(c[q.kind]||0)+1;});return Object.keys(c).map(function(k){return KINDNAME[k]+' '+c[k];}).join(' · ');}
function preview(q){var t=(q.q||'').replace(/\s+/g,' ');return t.length>150?t.slice(0,150)+'…':t;}

/* ---------- mini markdown ---------- */
function inline(s){
  s=esc(s);var codes=[];
  s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\u0000(\d+)\u0000/g,function(m,i){return '<code>'+codes[+i]+'</code>';});
  return s;
}
function md(src){
  var lines=String(src||'').replace(/\r/g,'').split('\n'),h='',toc=[],stack=[];
  function closeAll(){while(stack.length)h+='</li></'+stack.pop().tag+'>';}
  function item(tag,ind,content,num){
    while(stack.length&&stack[stack.length-1].ind>ind)h+='</li></'+stack.pop().tag+'>';
    var tp=stack[stack.length-1],li='<li'+(num?' value="'+num+'"':'')+'>';
    if(tp&&tp.ind===ind){
      if(tp.tag!==tag){h+='</li></'+stack.pop().tag+'><'+tag+'>'+li;stack.push({tag:tag,ind:ind});}
      else h+='</li>'+li;
    }else{h+='<'+tag+'>'+li;stack.push({tag:tag,ind:ind});}
    h+=inline(content);
  }
  function cells(r){return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){return x.trim();});}
  function isSep(r){return /^[\s|:\-]+$/.test(r)&&r.indexOf('-')>=0;}
  for(var i=0;i<lines.length;i++){
    var L=lines[i],m;
    if(/^\s*$/.test(L)){closeAll();continue;}
    if(/^\s*\|/.test(L)){
      closeAll();var rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      i--;var t='<div class="tbl"><table>',st=0;
      if(rows.length>1&&isSep(rows[1])){t+='<thead><tr>'+cells(rows[0]).map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead>';st=2;}
      t+='<tbody>';
      for(var r=st;r<rows.length;r++){if(isSep(rows[r]))continue;t+='<tr>'+cells(rows[r]).map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}
      h+=t+'</tbody></table></div>';continue;
    }
    if((m=L.match(/^(#{1,3})\s+(.*)$/))){
      closeAll();
      if(m[1].length===1)continue;
      if(m[1].length===2){var id='s'+toc.length;toc.push({id:id,t:m[2]});h+='<h2 id="'+id+'">'+inline(m[2])+'</h2>';}
      else h+='<h3>'+inline(m[2])+'</h3>';
      continue;
    }
    if((m=L.match(/^>\s?(.*)$/))){closeAll();h+='<p class="note">'+inline(m[1])+'</p>';continue;}
    if((m=L.match(/^(\s*)[-*]\s+(.*)$/))){item('ul',m[1].length,m[2]);continue;}
    if((m=L.match(/^(\s*)(\d+)[.)]\s+(.*)$/))){item('ol',m[1].length,m[3],m[2]);continue;}
    closeAll();h+='<p>'+inline(L)+'</p>';
  }
  closeAll();
  return {html:h,toc:toc};
}

/* ---------- question card ---------- */
function isCode(t){return /[{};]\s*$|^ {2,}\S|^\t|\bdef |print\s*\(|#include|<\?php|System\.out|printf\s*\(|<\/?[a-zA-Z][a-zA-Z0-9]*[^>]*>/m.test(t);}
function qHTML(q,st){
  var h='';
  if(!st.mock)h+='<div class="qmeta"><span class="tag lv'+q.lv+'">'+LVSHORT[q.lv]+'</span><span class="tag">'+esc(chapLabel(q))+'</span><span class="tag">'+esc(KINDNAME[q.kind]||'')+'</span></div>';
  h+='<div class="stem">'+esc(q.q)+'</div>';
  if(q.ctx&&!q.ctx_in_img)h+='<div class="ctx'+(isCode(q.ctx)?' code':'')+'">'+esc(q.ctx)+'</div>';
  if(q.im)h+='<div class="figs">'+q.im.map(function(n){return IMG[n]?'<img src="'+IMG[n]+'" alt="ภาพประกอบโจทย์">':'';}).join('')+'</div>';
  h+='<div class="choices">';
  q.ch.forEach(function(c,i){
    var cls='ch';
    if(st.reveal){if(i===q.a)cls+=' right';else if(i===st.chosen)cls+=' wrong';else cls+=' dim';}
    else if(st.chosen===i)cls+=' sel';
    h+='<button class="'+cls+'" data-ch="'+i+'"'+(st.reveal?' disabled':'')+'><span class="lt">'+LETTER[i]+'</span><span class="ct">'+(c?esc(c):'<i>ตัวเลือก '+LETTER[i]+' (ดูในภาพ)</i>')+'</span></button>';
  });
  h+='</div>';
  if(st.reveal){
    var has=typeof st.chosen==='number',ok=has&&st.chosen===q.a;
    var head=has?(ok?'✓ ถูกต้อง · ':'✗ ยังไม่ถูก · '):(st.mock?'ไม่ได้ตอบ · ':'');
    h+='<div class="exp '+(has?(ok?'ok':'no'):'')+'"><div class="eh">'+head+'เฉลย '+LETTER[q.a]+(q.ch[q.a]?'. '+esc(q.ch[q.a]):'')+'</div><div class="et">'+esc(q.e)+'</div><div class="src">ที่มา: '+esc(srcLabel(q))+' · <a href="#/read/'+q._k+'">อ่านสรุปบทนี้</a></div></div>';
  }
  return h;
}
function reviewItem(q,num,chosen,mock){
  var has=typeof chosen==='number',mk=has?(chosen===q.a?'<span class="mk ok">✓</span>':'<span class="mk no">✗</span>'):(mock?'<span class="mk no">–</span>':'');
  return '<details class="item"><summary><span class="num">'+num+'</span>'+mk+'<span class="pv">'+esc(preview(q))+'</span></summary><div class="card q">'+qHTML(q,{chosen:has?chosen:undefined,reveal:true,mock:mock})+'</div></details>';
}

/* ---------- practice session ---------- */
function filterOnly(pool){
  if(S.o.only==='new')return pool.filter(function(q){return !isDone(q);});
  if(S.o.only==='wrong')return pool.filter(isWrong);
  return pool;
}
function startLevel(k,lv){
  var c=CHK[k],pool=lv?BYCH[k][lv].slice():chAll(k);
  pool=filterOnly(pool);
  if(!pool.length){toast(S.o.only==='new'?'ทำครบทุกข้อในด่านนี้แล้ว ลองเปลี่ยนเป็น "ทั้งหมด"':S.o.only==='wrong'?'ไม่มีข้อที่เคยผิดในด่านนี้':'ไม่มีข้อสอบ');return;}
  pool=S.o.ord==='rand'?shuffle(pool):pool.sort(function(a,b){return a._i-b._i;});
  var n=S.o.n==='all'?pool.length:Math.min(+S.o.n,pool.length);
  startPrac(pool.slice(0,n).map(function(q){return q.id;}),'เล่ม '+c.b+' บท '+c.c+' · '+(lv?LVSHORT[lv]:'ผสมทุกด่าน'),'#/ch/'+k,function(){startLevel(k,lv);});
}

  if(!SES){go('#/');return;}

/* ---------- exam sets ---------- */
function buildSets(){
  if(SETS)return SETS;
  var map={};SETS=[];
  Q.forEach(function(q){
    if(q.kind==='book'||q.kind==='auth')return;
    var name=q.src.replace(/\s*ข้อ\s*\d+.*$/,'').trim(),key=q.kind+'|'+name;
    if(!map[key]){map[key]={kind:q.kind,name:name,ids:[]};SETS.push(map[key]);}
    map[key].ids.push(q.id);
  });
  var num=function(id){var m=BYID[id].src.match(/ข้อ\s*(\d+)/);return m?+m[1]:BYID[id]._i;};
  var yr=function(s){var m=s.name.match(/25\d\d/);return m?+m[0]:0;};
  SETS.forEach(function(s){s.ids.sort(function(a,b){return num(a)-num(b);});});
  var order={real:0,final:1,monthly:2,extra:3};
  SETS.sort(function(a,b){return order[a.kind]-order[b.kind]||yr(b)-yr(a)||a.name.localeCompare(b.name,'th');});
  return SETS;
}
function viewSets(){
  var sets=buildSets(),h=top('#/','ชุดข้อสอบ')+'<div class="wrap"><p class="muted" style="font-size:.9rem;margin-top:14px">ทำทีละชุดตามลำดับข้อเดิม เลือก <b>ฝึก</b> เพื่อดูเฉลยทันที หรือ <b>จับเวลา</b> เพื่อทำแบบสอบจริง (1.2 นาทีต่อข้อ)</p>';
  var titles={real:'ข้อสอบจริง (หลายสนาม)',final:'ข้อสอบโค้งสุดท้าย',monthly:'ข้อสอบประจำเดือน',extra:'ข้อสอบเพิ่มเติมในเล่ม'},cur='';
  sets.forEach(function(s,i){
    if(s.kind!==cur){cur=s.kind;h+='<div class="sec"><h2>'+titles[cur]+'</h2></div>';}
    var st=stat(s.ids.map(function(id){return BYID[id];}));
    h+='<div class="setrow"><div><b>'+esc(s.name)+'</b><small>'+st.n+' ข้อ · ทำแล้ว '+pct(st.d,st.n)+'%'+(st.d?' · ถูก '+pct(st.ok,st.d)+'%':'')+'</small></div><div class="setbtn"><button class="btn sm" data-act="setp" data-i="'+i+'">ฝึก</button><button class="btn sm pri" data-act="setm" data-i="'+i+'">จับเวลา</button></div></div>';
  });
  app.innerHTML=h+'</div>';
}

/* ---------- mock exam ---------- */
function wsample(pool,n,wf){return pool.map(function(q){return {q:q,k:Math.pow(Math.random(),1/wf(q))};}).sort(function(a,b){return b.k-a.k;}).slice(0,n).map(function(x){return x.q;});}
function buildMock(n){
  var counts=GROUPS.map(function(g){return Math.floor(n*g.w/100);}),sum=counts.reduce(function(a,b){return a+b;},0);
  var order=GROUPS.map(function(g,i){return {i:i,f:n*g.w/100-counts[i]};}).sort(function(a,b){return b.f-a.f;});
  for(var j=0;sum<n;j++,sum++)counts[order[j%order.length].i]++;
  var W={1:1,2:1.6,3:2.2},ids=[];
  GROUPS.forEach(function(g,gi){
    var pool=[];g.chs.forEach(function(k){pool=pool.concat(chAll(k));});
    ids=ids.concat(wsample(pool,counts[gi],function(q){return W[q.lv]*(isDone(q)?0.6:1);}).map(function(q){return q.id;}));
  });
  return shuffle(ids);
}

  if(S.hist.length){h+='<div class="sec"><h2>ประวัติการสอบ</h2></div><div class="card hist">'+S.hist.slice(0,15).map(function(r){var d=new Date(r.t);return '<div><span>'+d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · '+esc(r.title)+'</span><b>'+r.ok+'/'+r.n+' ('+pct(r.ok,r.n)+'%)</b></div>';}).join('')+'</div>';}

function mockChoose(i){var M=MOCK,q=BYID[M.ids[M.i]];if(i>=q.ch.length)return;if(M.ans[q.id]===i)delete M.ans[q.id];else M.ans[q.id]=i;mockRun();}
function submitMock(timeout){
  var M=MOCK;if(!M||M.state!=='run')return;
  var un=M.ids.length-Object.keys(M.ans).length;
  if(!timeout&&!confirm(un?'ยังไม่ได้ตอบ '+un+' ข้อ ต้องการส่งคำตอบเลยหรือไม่?':'ส่งคำตอบ?'))return;
  var g=GROUPS.map(function(x){return {name:x.name,n:0,ok:0};}),ok=0;
  M.ids.forEach(function(id){var q=BYID[id],a=M.ans[id],gi=GOF[q._k];g[gi].n++;if(a!==undefined){if(record(q,a)){ok++;g[gi].ok++;}}});
  M.res={ok:ok,n:M.ids.length,used:Math.min(Date.now(),M.end)-M.start,groups:g,timeout:!!timeout};
  M.state='done';
  S.hist.unshift({t:Date.now(),title:M.title,n:M.ids.length,ok:ok});S.hist=S.hist.slice(0,30);save();

/* ---------- router ---------- */
var lastRoute='';
function route(){
  var hsh=location.hash.replace(/^#\/?/,''),parts=hsh.split('/');
  var keep=hsh===lastRoute;lastRoute=hsh;
  switch(parts[0]){
    case 'ch':viewChap(parts[1]);break;
    case 'read':viewRead(parts[1]);break;
    case 'quiz':viewQuiz();break;
    case 'result':viewResult();break;
    case 'review':viewReview(parts[1]);break;
    case 'sets':viewSets();break;
    case 'search':viewSearch();break;
    case 'mock':viewMock();break;
    default:viewHome();
  }
  if(!keep)window.scrollTo(0,0);
}

  fs:function(){S.o.fs=S.o.fs?0:1;save();route();},
  lv:function(t){startLevel(t.dataset.k,+t.dataset.lv);},

  revall:function(t){var l=shuffle(revList(t.dataset.tab));startPrac(l.map(function(q){return q.id;}),t.dataset.tab==='bm'?'ทบทวนข้อที่เก็บไว้':'ทบทวนข้อผิดทั้งหมด','#/review'+(t.dataset.tab==='bm'?'/bm':''),null);},
  revch:function(t){var k=t.dataset.k,l=shuffle(revList(t.dataset.tab,k));startPrac(l.map(function(q){return q.id;}),'ทบทวน · เล่ม '+CHK[k].b+' บท '+CHK[k].c,'#/review'+(t.dataset.tab==='bm'?'/bm':''),null);},
  setp:function(t){var s=buildSets()[+t.dataset.i];startPrac(s.ids.slice(),s.name,'#/sets',null);},
  setm:function(t){var s=buildSets()[+t.dataset.i];if(MOCK&&MOCK.state==='run'&&!confirm('มีการสอบที่ยังทำค้างอยู่ จะเริ่มชุดใหม่แทนหรือไม่?'))return;startMock(s.ids.slice(),s.name,Math.max(5,Math.round(s.ids.length*1.2)),'#/sets');},
  srquiz:function(){startPrac(SR.slice(0,50).map(function(q){return q.id;}),'ข้อที่ค้นเจอ: '+lastSearch,'#/search',null);},
  mstart:function(t){var n=+t.dataset.n;startMock(buildMock(n),'จำลองสอบกรมที่ดิน '+n+' ข้อ',+t.dataset.min);},
  mflag:function(){var id=MOCK.ids[MOCK.i];if(MOCK.flag[id])delete MOCK.flag[id];else MOCK.flag[id]=1;mockRun();},

  mrv:function(t){MOCK.rv=t.dataset.v;mockResult();},
  mnew:function(){var back=MOCK.back;MOCK=null;go(back);},
  mwrong:function(){var M=MOCK,w=M.ids.filter(function(id){return M.ans[id]!==BYID[id].a;});startPrac(shuffle(w),'ฝึกข้อผิดจากการจำลองสอบ','#/mock',null);},
  exp:function(){try{var b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ความคืบหน้า-ติวกรมที่ดิน.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);}catch(e){toast('สำรองไม่สำเร็จในเบราว์เซอร์นี้');}},
  imp:function(){
    if(!confirm('การนำเข้าจะแทนที่ความคืบหน้าปัจจุบันทั้งหมด ต้องการทำต่อหรือไม่?'))return;
    var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o.p!=='object')throw 0;S.p=o.p;S.bm=o.bm||{};S.hist=o.hist||[];if(o.o)for(var k in o.o)S.o[k]=o.o[k];save();applyPrefs();toast('นำเข้าความคืบหน้าแล้ว');route();}catch(e){toast('ไฟล์ไม่ถูกต้อง');}};r.readAsText(f);};
    inp.click();
  },
  reset:function(){if(confirm('ล้างความคืบหน้า ข้อที่เก็บไว้ และประวัติการสอบทั้งหมด?')){S.p={};S.bm={};S.hist=[];save();toast('ล้างแล้ว');route();}}
};
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-ch],[data-act],[data-set],[data-sc]');if(!t)return;
  if(t.dataset.ch!==undefined){
    var i=+t.dataset.ch;
    if(location.hash.indexOf('#/quiz')===0&&SES)pracChoose(i);
    else if(location.hash.indexOf('#/mock')===0&&MOCK&&MOCK.state==='run')mockChoose(i);
    return;
  }
  if(t.dataset.sc){var el=document.getElementById(t.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.dataset.set){var kv=t.dataset.set.split(':'),k=kv[0],v=kv[1];S.o[k]=(k==='n'&&v!=='all')||k==='font'?+v:v;save();if(k==='theme'||k==='font')applyPrefs();route();return;}
  var a=ACT[t.dataset.act];if(a)a(t);
});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var h=location.hash,n=parseInt(e.key,10);
  if(h.indexOf('#/quiz')===0&&SES){
    if(n>=1&&n<=6){pracChoose(n-1);e.preventDefault();}
    else if((e.key==='Enter'||e.key==='ArrowRight')&&SES.ans[SES.ids[SES.i]]!==undefined){pracNext();e.preventDefault();}
  }else if(h.indexOf('#/mock')===0&&MOCK&&MOCK.state==='run'){
    if(n>=1&&n<=6){mockChoose(n-1);e.preventDefault();}
    else if(e.key==='ArrowRight')ACT.mnext();else if(e.key==='ArrowLeft')ACT.mprev();
  }
});
function applyPrefs(){
  var r=document.documentElement;
  if(S.o.theme==='light'||S.o.theme==='dark')r.setAttribute('data-theme',S.o.theme);else r.removeAttribute('data-theme');
  r.style.setProperty('--fs',[14.5,16,17.5,19][S.o.font]+'px');
}
setInterval(function(){
  if(!MOCK||MOCK.state!=='run')return;
  var rem=MOCK.end-Date.now();
  if(rem<=0){submitMock(true);return;}
  var el=document.getElementById('timer');if(el){el.textContent=fmt(rem);if(rem<300000)el.classList.add('warn');}
},1000);
window.addEventListener('beforeunload',function(e){if(MOCK&&MOCK.state==='run'){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',route);
load();applyPrefs();route();
})();
</script>
